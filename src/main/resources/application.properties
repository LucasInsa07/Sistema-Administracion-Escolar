spring.application.name=sistema_gestion_escolar
# Swagger/OpenAPI base info (optional)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# DTO/Swagger examples: sin configuración adicional por ahora. Mantener contratos en controllers.

# Configuración de la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_escolar}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Configuración de JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}


spring.mvc.hiddenmethod.filter.enabled=true

# CORS allowed origins (comma-separated), override per environment
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


